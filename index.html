<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Pemantauan Projek JKN Perlis</title>
  
  <!-- Tetapan PWA & Meta Tags -->
  <meta name="theme-color" content="#0b1120">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-512.png" type="image/png">
  <link rel="apple-touch-icon" href="icon-512.png">
  
  <style>
    /* Reset margin dan pastikan iframe memenuhi skrin sepenuhnya tanpa sempadan */
    body, html { 
      margin: 0; 
      padding: 0; 
      height: 100%; 
      overflow: hidden; 
      background-color: #0b1120; 
    }
    iframe { 
      width: 100%; 
      height: 100%; 
      border: none; 
      display: block; 
    }
  </style>
</head>
<body>

  <!-- Balutan URL Dashboard Anda -->
  <iframe src="https://script.google.com/a/macros/moh.gov.my/s/AKfycbx1zmMt6afqqWhEn7BXgQl6rzm5uquqmMCEkKrA502TyOBA-loh9R8KF-nUmkLOjeg12Q/exec" allowfullscreen></iframe>

  <!-- Skrip Pendaftaran Service Worker (sw.js) -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('Service Worker berjaya didaftarkan.', reg.scope))
          .catch(err => console.error('Pendaftaran Service Worker gagal:', err));
      });
    }
  </script>
</body>
</html>
